<div class="details-page">
    <div class="details-topbar">
        <button
            class="back-btn"
            routerLink="/diary">
            ← Back to Diary
        </button>
        @if (diary) {
            <button
                class="edit-diary-btn"
                (click)="editDiary()">
                ✏️ Edit Diary
            </button>
        }
    </div>
    @if (loading) {
        <div class="details-state">
            <div class="spinner"></div>
            <p>
                Opening your diary...
            </p>
        </div>
    }
    @else if (error) {
        <div class="details-state error">
            <div class="state-icon">
                ⚠️
            </div>
            <h4>
                Unable to open diary
            </h4>
            <p>
                {{ error }}
            </p>
            <button
                class="back-state-btn"
                routerLink="/diary">
                Back to Diary
            </button>
        </div>
    }
    @else if (diary) {
        <article class="diary-reading-card">
            <div class="diary-reading-header">
                <span class="reading-label">
                    DIARY ENTRY
                </span>
                <div class="diary-date">
                    {{ getDiaryDate() | date:'EEEE, MMMM d, y' }}
                </div>
            </div>
            <h1 class="diary-title">
                {{ diary.title }}
            </h1>
            <div class="title-line"></div>
            <div
                class="diary-content"
                [innerHTML]="diary.content">
            </div>
            <footer class="diary-reading-footer">
                <span>
                    Written
                    {{ diary.createdAt | date:'MMM d, y • shortTime' }}
                </span>
            </footer>
        </article>
    }
</div>
