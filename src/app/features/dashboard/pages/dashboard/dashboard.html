<div class="row">
    <div class="col-md-4">
        <app-stat-card title="Total Habits" [value]="totalHabits" icon="📚"> </app-stat-card>
    </div>
    <div class="col-md-4">
        <app-stat-card title="Completed Today" [value]="completedToday" icon="✅"> </app-stat-card>
    </div>
    <div class="col-md-4">
        <app-stat-card title="Current Streak" [value]="currentStreak" icon="🔥"> </app-stat-card>
    </div>
</div>
<div class="row mt-4">
    <div class="col-md-4 mb-3">
        <mat-card>
            <mat-card-header>
                <mat-card-title> 📅 Daily Progress </mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <h2>{{ dailyPercentage }}%</h2>
                <mat-progress-bar mode="determinate" [value]="dailyPercentage"></mat-progress-bar>
            </mat-card-content>
        </mat-card>
    </div>
    <div class="col-md-4 mb-3">
        <mat-card>
            <mat-card-header>
                <mat-card-title> 📖 Weekly Progress </mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <h2>{{ weeklyPercentage }}%</h2>
                <mat-progress-bar mode="determinate" [value]="weeklyPercentage"> </mat-progress-bar>
            </mat-card-content>
        </mat-card>
    </div>
    <div class="col-md-4 mb-3">
        <mat-card>
            <mat-card-header>
                <mat-card-title> 🗓️ Monthly Progress </mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <h2>{{ monthlyPercentage }}%</h2>
                <mat-progress-bar mode="determinate" [value]="monthlyPercentage"> </mat-progress-bar>
            </mat-card-content>
        </mat-card>
    </div>
</div>
<div class="card shadow-sm mt-4 p-4">
    <h4 class="mb-4">Weekly Progress</h4>
    <canvas
        baseChart
        [data]="barChartData"
        [options]="barChartOptions"
        [type]="barChartType">
    </canvas>
</div>
