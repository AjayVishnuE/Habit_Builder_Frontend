<h2 mat-dialog-title>Complete Habit</h2>
<form [formGroup]="completeForm" (ngSubmit)="complete()">
    <mat-dialog-content>
        <mat-form-field appearance="outline" class="w-100">
            <mat-label>Mood</mat-label>
            <mat-select formControlName="mood">
                <mat-option value="Excellent"> 😄 Excellent </mat-option>
                <mat-option value="Great"> 😊 Great </mat-option>
                <mat-option value="Good"> 🙂 Good </mat-option>
                <mat-option value="Okay"> 😐 Okay </mat-option>
                <mat-option value="Bad"> 😞 Bad </mat-option>
            </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-100">
            <mat-label>Duration (minutes)</mat-label>
            <input matInput type="number" min="0" formControlName="duration">
        </mat-form-field>
        <mat-form-field appearance="outline" class="w-100">
            <mat-label>Remark</mat-label>
            <textarea matInput rows="4" maxlength="250" formControlName="remark"></textarea>
            <mat-hint align="end">
                {{ completeForm.controls.remark.value.length }}/250
            </mat-hint>
        </mat-form-field>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
        <button mat-button type="button" (click)="cancel()"> 
            Cancel
        </button>
        <button mat-raised-button color="primary" type="submit">
            Complete
        </button>
    </mat-dialog-actions>
</form>
