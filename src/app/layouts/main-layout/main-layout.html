<mat-sidenav-container class="container">
  <!-- Desktop Sidebar -->
  <mat-sidenav class="desktop-sidenav" mode="side" opened>
    <div class="brand">
      <h2>Habit Builder</h2>
    </div>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>dashboard</mat-icon>
        <span>Dashboard</span>
      </a>
      <a mat-list-item routerLink="/diary" routerLinkActive="active">
        <mat-icon>menu_book</mat-icon>
        <span>Diary</span>
      </a>
      <a mat-list-item routerLink="/habits" routerLinkActive="active">
        <mat-icon>check_circle</mat-icon>
        <span>Habits</span>
      </a>
      <a mat-list-item routerLink="/tasks-notes" routerLinkActive="active">
        <mat-icon>checklist</mat-icon>
        <span>Tasks & Notes</span>
      </a>
      <a mat-list-item routerLink="/profile" routerLinkActive="active">
        <mat-icon>person</mat-icon>
        <span>Profile</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>
  <!-- Main Content -->
  <mat-sidenav-content>
    <mat-toolbar class="top-toolbar">
      <span>Habit Builder</span>
    </mat-toolbar>
    <div class="page">
      <router-outlet></router-outlet>
    </div>
    <!-- Mobile Bottom Navigation -->
    <nav class="mobile-bottom-nav">
      <!-- Dashboard -->
      <a routerLink="/dashboard" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <mat-icon>dashboard</mat-icon>
      </a>
      <!-- Diary -->
      <a routerLink="/diary" routerLinkActive="active">
        <mat-icon>menu_book</mat-icon>
      </a>
      <!-- Habits - Center -->
      <a class="habits-nav" routerLink="/habits" routerLinkActive="active">
        <span class="habits-icon">
          <mat-icon>check_circle</mat-icon>
        </span>
      </a>
      <!-- Tasks & Notes -->
      <a routerLink="/tasks-notes" routerLinkActive="active">
        <mat-icon>checklist</mat-icon>
      </a>
      <!-- Profile -->
      <a routerLink="/profile" routerLinkActive="active">
        <mat-icon>person</mat-icon>
      </a>
    </nav>
  </mat-sidenav-content>
</mat-sidenav-container>
